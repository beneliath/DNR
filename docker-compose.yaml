services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80" # Publish on the LAN for the Traefik reverse proxy
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - dnr_2fa_encryption_key
    environment:
      - DEFAULT_SPEAKER=Default Speaker # or whatever default speaker name you want
      - DNR_2FA_ENCRYPTION_KEY_FILE=/run/secrets/dnr_2fa_encryption_key
      - DNR_TRUSTED_PROXY_IPS=${DNR_TRUSTED_PROXY_IPS:-192.168.65.1}
      - DNR_TRUSTED_CLOUDFLARE_PROXY_IPS=${DNR_TRUSTED_CLOUDFLARE_PROXY_IPS:-172.18.0.14}
      - DNR_TIMEZONE=${DNR_TIMEZONE:-America/Chicago}
      - DNR_GITHUB_REPOSITORY=${DNR_GITHUB_REPOSITORY:-beneliath/DNR}
      - DNR_GITHUB_BRANCH=${DNR_GITHUB_BRANCH:-main}
      - DNR_GITHUB_PUSH_CACHE_TTL=${DNR_GITHUB_PUSH_CACHE_TTL:-120}

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dnr
      MYSQL_USER: dnruser
      MYSQL_PASSWORD: dnrpassword
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data:

secrets:
  dnr_2fa_encryption_key:
    file: ${DNR_2FA_KEY_FILE:-./secrets/dnr_2fa_encryption_key}
