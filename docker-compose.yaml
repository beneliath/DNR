x-app-environment: &app-environment
  DEFAULT_SPEAKER: ${DEFAULT_SPEAKER:-Olivier Melnick}
  DB_HOST: db
  MYSQL_DATABASE: dnr
  MYSQL_USER: dnruser
  MYSQL_PASSWORD_FILE: /run/secrets/dnr_mysql_app_password
  DNR_2FA_ENCRYPTION_KEY_FILE: /run/secrets/dnr_2fa_encryption_key
  DNR_PUBLIC_BASE_URL: ${DNR_PUBLIC_BASE_URL:-}
  DNR_TRUSTED_PROXY_IPS: ${DNR_TRUSTED_PROXY_IPS:-192.168.65.1}
  DNR_TRUSTED_CLOUDFLARE_PROXY_IPS: ${DNR_TRUSTED_CLOUDFLARE_PROXY_IPS:-172.18.0.0/24}
  DNR_TIMEZONE: ${DNR_TIMEZONE:-America/Chicago}
  DNR_DATABASE_BACKUP_MAX_BYTES: ${DNR_DATABASE_BACKUP_MAX_BYTES:-67108864}
  DNR_GITHUB_REPOSITORY: ${DNR_GITHUB_REPOSITORY:-beneliath/DNR}
  DNR_REQUIRE_HTTPS: ${DNR_REQUIRE_HTTPS:-1}
  DNR_SESSION_IDLE_SECONDS: ${DNR_SESSION_IDLE_SECONDS:-1800}
  DNR_SESSION_ABSOLUTE_SECONDS: ${DNR_SESSION_ABSOLUTE_SECONDS:-43200}
  DNR_SESSION_ROTATION_SECONDS: ${DNR_SESSION_ROTATION_SECONDS:-900}
  DNR_MAP_PAST_DAYS: ${DNR_MAP_PAST_DAYS:-90}
  DNR_MAP_FUTURE_DAYS: ${DNR_MAP_FUTURE_DAYS:-730}
  DNR_MAP_MAX_EVENTS: ${DNR_MAP_MAX_EVENTS:-500}

services:
  web:
    build:
      context: .
      args:
        DNR_BUILD_COMMIT: ${DNR_BUILD_COMMIT:-}
        DNR_BUILD_TIMESTAMP: ${DNR_BUILD_TIMESTAMP:-}
    restart: unless-stopped
    read_only: true
    ports:
      - "${DNR_BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/php/sessions:rw,noexec,nosuid,size=32m
      - /var/lock/apache2:rw,noexec,nosuid,size=1m
      - /var/run/apache2:rw,noexec,nosuid,size=1m
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, NET_BIND_SERVICE, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - dnr_2fa_encryption_key
      - dnr_mysql_app_password
    environment: *app-environment
    networks: [ingress, backend]
    healthcheck:
      test: ["CMD", "php", "/opt/dnr/bin/check_schema.php"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  geocoder:
    build:
      context: .
      args:
        DNR_BUILD_COMMIT: ${DNR_BUILD_COMMIT:-}
        DNR_BUILD_TIMESTAMP: ${DNR_BUILD_TIMESTAMP:-}
    restart: unless-stopped
    read_only: true
    user: www-data
    entrypoint: ["php", "/opt/dnr/bin/process_geocode_queue.php", "--loop"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - dnr_mysql_app_password
    environment:
      DB_HOST: db
      MYSQL_DATABASE: dnr
      MYSQL_USER: dnruser
      MYSQL_PASSWORD_FILE: /run/secrets/dnr_mysql_app_password
      DNR_GEOCODER_BASE_URL: ${DNR_GEOCODER_BASE_URL:-https://nominatim.openstreetmap.org/search}
      DNR_GEOCODER_ALLOWED_HOSTS: ${DNR_GEOCODER_ALLOWED_HOSTS:-nominatim.openstreetmap.org}
      DNR_GEOCODER_USER_AGENT: ${DNR_GEOCODER_USER_AGENT:-}
      DNR_GEOCODER_BATCH_SIZE: ${DNR_GEOCODER_BATCH_SIZE:-10}
      DNR_GEOCODER_IDLE_SECONDS: ${DNR_GEOCODER_IDLE_SECONDS:-30}
    networks: [backend, egress]

  maintenance:
    build:
      context: .
      args:
        DNR_BUILD_COMMIT: ${DNR_BUILD_COMMIT:-}
        DNR_BUILD_TIMESTAMP: ${DNR_BUILD_TIMESTAMP:-}
    profiles: [maintenance]
    read_only: true
    user: www-data
    entrypoint: ["php", "/opt/dnr/bin/restore_database.php"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups:ro
    secrets:
      - dnr_mysql_maintenance_password
      - dnr_backup_password
    environment:
      DB_HOST: db
      MYSQL_DATABASE: dnr
      MYSQL_USER: dnrmaintenance
      MYSQL_PASSWORD_FILE: /run/secrets/dnr_mysql_maintenance_password
      DNR_BACKUP_PASSWORD_FILE: /run/secrets/dnr_backup_password
      DNR_DATABASE_BACKUP_MAX_BYTES: ${DNR_DATABASE_BACKUP_MAX_BYTES:-67108864}
    networks: [backend]

  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/dnr_mysql_root_password
      MYSQL_DATABASE: dnr
      MYSQL_USER: dnruser
      MYSQL_PASSWORD_FILE: /run/secrets/dnr_mysql_app_password
      MYSQL_MAINTENANCE_USER: dnrmaintenance
      MYSQL_MAINTENANCE_PASSWORD_FILE: /run/secrets/dnr_mysql_maintenance_password
    secrets:
      - dnr_mysql_root_password
      - dnr_mysql_app_password
      - dnr_mysql_maintenance_password
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./scripts/configure_database_privileges.sh:/docker-entrypoint-initdb.d/99-configure_database_privileges.sh:ro
      - ./migrations:/opt/dnr/migrations:ro
      - ./scripts/migrate.sh:/opt/dnr/bin/migrate:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data:

networks:
  # Docker Engine does not activate published ports for containers connected
  # only to an internal network. This bridge accepts localhost-forwarded
  # traffic without masquerading outbound web-container traffic.
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  backend:
    internal: true
  egress:

secrets:
  dnr_2fa_encryption_key:
    file: ${DNR_2FA_KEY_FILE:-./secrets/dnr_2fa_encryption_key}
  dnr_mysql_root_password:
    file: ${DNR_MYSQL_ROOT_PASSWORD_FILE:-./secrets/mysql_root_password}
  dnr_mysql_app_password:
    file: ${DNR_MYSQL_APP_PASSWORD_FILE:-./secrets/mysql_app_password}
  dnr_mysql_maintenance_password:
    file: ${DNR_MYSQL_MAINTENANCE_PASSWORD_FILE:-./secrets/mysql_maintenance_password}
  dnr_backup_password:
    file: ${DNR_BACKUP_PASSWORD_FILE:-./secrets/backup_password}
