services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${DNR_BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - dnr_2fa_encryption_key
    environment:
      - DEFAULT_SPEAKER=${DEFAULT_SPEAKER:-Olivier Melnick}
      - DB_HOST=db
      - MYSQL_DATABASE=dnr
      - MYSQL_USER=dnruser
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      - DNR_2FA_ENCRYPTION_KEY_FILE=/run/secrets/dnr_2fa_encryption_key
      - DNR_CALENDAR_TOKEN=${DNR_CALENDAR_TOKEN:-}
      - DNR_PUBLIC_BASE_URL=${DNR_PUBLIC_BASE_URL:-}
      - DNR_TRUSTED_PROXY_IPS=${DNR_TRUSTED_PROXY_IPS:-docker-gateway}
      - DNR_TRUSTED_CLOUDFLARE_PROXY_IPS=${DNR_TRUSTED_CLOUDFLARE_PROXY_IPS:-172.18.0.14}
      - DNR_TIMEZONE=${DNR_TIMEZONE:-America/Chicago}
      - DNR_DATABASE_BACKUP_MAX_BYTES=${DNR_DATABASE_BACKUP_MAX_BYTES:-67108864}
      - DNR_GITHUB_REPOSITORY=${DNR_GITHUB_REPOSITORY:-beneliath/DNR}
      - DNR_GITHUB_BRANCH=${DNR_GITHUB_BRANCH:-main}
      - DNR_GITHUB_PUSH_CACHE_TTL=${DNR_GITHUB_PUSH_CACHE_TTL:-120}
      - DNR_GITHUB_RETRY_TTL=${DNR_GITHUB_RETRY_TTL:-300}
      - DNR_GEOCODER_BASE_URL=${DNR_GEOCODER_BASE_URL:-https://nominatim.openstreetmap.org/search}
      - DNR_GEOCODER_USER_AGENT=${DNR_GEOCODER_USER_AGENT:-}

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: dnr
      MYSQL_USER: dnruser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./scripts/configure_database_privileges.sh:/docker-entrypoint-initdb.d/99-configure_database_privileges.sh:ro
      - ./migrations:/opt/dnr/migrations:ro
      - ./scripts/migrate.sh:/opt/dnr/bin/migrate:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  db_data:

secrets:
  dnr_2fa_encryption_key:
    file: ${DNR_2FA_KEY_FILE:-./secrets/dnr_2fa_encryption_key}
