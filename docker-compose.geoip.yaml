# Optional offline country lookups, with region and city when a City MMDB is supplied.
services:
  web:
    environment:
      DNR_GEOIP_DATABASE: /opt/dnr/geoip/country.mmdb
    volumes:
      - ${DNR_GEOIP_DATABASE_FILE:?Set DNR_GEOIP_DATABASE_FILE to a Country or City MMDB file}:/opt/dnr/geoip/country.mmdb:ro
