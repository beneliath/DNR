services:
  web:
    environment:
      DNR_MAIL_TRANSPORT: smtp

  mail-dispatch:
    healthcheck:
      test: ["CMD", "php", "/opt/dnr/bin/check_worker_health.php", "mail-dispatch"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    image: ${DNR_APP_IMAGE:-dnr-app:local}
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    build:
      context: .
      args:
        DNR_BUILD_COMMIT: ${DNR_BUILD_COMMIT:-}
        DNR_BUILD_TIMESTAMP: ${DNR_BUILD_TIMESTAMP:-}
    restart: unless-stopped
    read_only: true
    user: www-data
    entrypoint: ["php", "/opt/dnr/bin/process_email_outbox.php", "--loop"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    depends_on:
      migrator:
        condition: service_completed_successfully
    secrets:
      - dnr_mysql_mail_dispatch_password
      - dnr_2fa_encryption_key
      - dnr_smtp_password
    environment:
      DB_HOST: db
      MYSQL_DATABASE: dnr
      MYSQL_USER: dnrmaildispatch
      MYSQL_PASSWORD_FILE: /run/secrets/dnr_mysql_mail_dispatch_password
      DNR_2FA_ENCRYPTION_KEY_FILE: /run/secrets/dnr_2fa_encryption_key
      DNR_MAIL_TRANSPORT: smtp
      DNR_PUBLIC_BASE_URL: ${DNR_PUBLIC_BASE_URL:-}
      DNR_REQUIRE_HTTPS: ${DNR_REQUIRE_HTTPS:-1}
      DNR_TIMEZONE: ${DNR_TIMEZONE:-}
      DNR_MAIL_FROM: ${DNR_MAIL_FROM:-}
      DNR_MAIL_FROM_NAME: ${DNR_MAIL_FROM_NAME:-}
      DNR_SMTP_HOST: ${DNR_SMTP_HOST:-}
      DNR_SMTP_PORT: ${DNR_SMTP_PORT:-587}
      DNR_SMTP_ENCRYPTION: ${DNR_SMTP_ENCRYPTION:-starttls}
      DNR_SMTP_USERNAME: ${DNR_SMTP_USERNAME:-}
      DNR_SMTP_PASSWORD_FILE: /run/secrets/dnr_smtp_password
      DNR_EMAIL_OUTBOX_BATCH_SIZE: ${DNR_EMAIL_OUTBOX_BATCH_SIZE:-20}
      DNR_EMAIL_OUTBOX_IDLE_SECONDS: ${DNR_EMAIL_OUTBOX_IDLE_SECONDS:-15}
      DNR_NOTIFICATION_OUTBOX_BATCH_SIZE: ${DNR_NOTIFICATION_OUTBOX_BATCH_SIZE:-20}
      DNR_ENGAGEMENT_EMAIL_OUTBOX_BATCH_SIZE: ${DNR_ENGAGEMENT_EMAIL_OUTBOX_BATCH_SIZE:-20}
      DNR_NOTIFICATION_SCHEDULE_INTERVAL_SECONDS: ${DNR_NOTIFICATION_SCHEDULE_INTERVAL_SECONDS:-300}
      DNR_TASK_UPCOMING_DAYS: ${DNR_TASK_UPCOMING_DAYS:-}
      DNR_DASHBOARD_UPCOMING_DAYS: ${DNR_DASHBOARD_UPCOMING_DAYS:-}
      DNR_CONFIG_FILE: /run/dnr/config/application.yaml
      DNR_BRAND_DISPLAY_NAME: ${DNR_BRAND_DISPLAY_NAME:-}
      DNR_CALENDAR_NAME: ${DNR_CALENDAR_NAME:-}
    volumes:
      - ${DNR_CONFIG_FILE_HOST:-./deployments/moed/application.yaml}:/run/dnr/config/application.yaml:ro
    networks: [backend, egress]

secrets:
  dnr_smtp_password:
    file: ${DNR_SMTP_PASSWORD_SECRET_FILE:-./secrets/smtp_password}
