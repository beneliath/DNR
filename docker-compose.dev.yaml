services:
  ai-coach-worker:
    volumes:
      - ./src:/var/www/html:ro
      - ./tests:/opt/dnr/tests:ro

  downloads:
    volumes:
      - ./src:/var/www/html:ro
      - ./migrations:/opt/dnr/migrations:ro
      - ./docker/php-development.ini:/usr/local/etc/php/conf.d/zz-dnr-development.ini:ro
    environment:
      DNR_REQUIRE_HTTPS: "0"
  file-monitor:
    volumes:
      - ./src:/var/www/html:ro
      - ./scripts/maintain_file_storage.php:/opt/dnr/bin/maintain_file_storage.php:ro
  file-migrator:
    volumes:
      - ./src:/var/www/html:ro
      - ./scripts/migrate_persistent_files.php:/opt/dnr/bin/migrate_persistent_files.php:ro
  web:
    volumes:
      - ./src:/var/www/html:ro
      - ./tests:/opt/dnr/tests:ro
      # Read-only, narrowly scoped evidence for the local feedback-review CLI.
      - ./src:/opt/dnr/coach-review-src/src:ro
      - ./docs:/opt/dnr/coach-review-src/docs:ro
      - ./tests:/opt/dnr/coach-review-src/tests:ro
      - ./scripts/ai_help:/opt/dnr/coach-review-src/scripts/ai_help:ro
      - ./migrations:/opt/dnr/migrations:ro
      - ./docker/php-development.ini:/usr/local/etc/php/conf.d/zz-dnr-development.ini:ro
    environment:
      DNR_REQUIRE_HTTPS: "0"
      DNR_MAIL_TRANSPORT: log
  geocoder:
    volumes:
      - ./src:/var/www/html:ro
      - ./tests:/opt/dnr/tests:ro
  maintenance:
    volumes:
      - ./tests:/opt/dnr/tests:ro
  backup:
    volumes:
      - ./src:/var/www/html:ro
      - ./scripts/backup_endpoint.php:/opt/dnr/backup-public/export.php:ro
      - ./docker/php-development.ini:/usr/local/etc/php/conf.d/zz-dnr-development.ini:ro

  # Plaintext development HTTP is deliberately isolated from the production
  # publish address. Remote exposure requires a separate, explicit opt-in.
  ingress:
    ports: !override
      - "${DNR_DEV_BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    environment:
      DNR_DEV_BIND_ADDRESS: ${DNR_DEV_BIND_ADDRESS:-127.0.0.1}
      DNR_DEV_ALLOW_REMOTE_HTTP: ${DNR_DEV_ALLOW_REMOTE_HTTP:-0}
    entrypoint: ["/usr/local/bin/dnr-development-ingress-entrypoint"]
