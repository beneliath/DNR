# This container is a fixed reverse proxy, never a forward proxy. Keeping the
# public port off the application container preserves its internal-only route.
ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders On

# Keep the read-only notice available while the application/database are stopped.
ProxyPass "/deployment_status.php" "!"

# Backup encryption and streaming is the only request allowed to occupy a
# backend connection for up to five minutes. Keep the general application
# timeout bounded so unrelated slow clients cannot amplify worker usage.
ProxyPass "/database_maintenance.php" "http://web:80/database_maintenance.php" connectiontimeout=5 timeout=300 retry=0
ProxyPassReverse "/database_maintenance.php" "http://web:80/database_maintenance.php"
ProxyPass "/" "http://web:80/" connectiontimeout=5 timeout=60 retry=0
ProxyPassReverse "/" "http://web:80/"
