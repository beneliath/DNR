# This container is a fixed reverse proxy, never a forward proxy. Keeping the
# public port off the application container preserves its internal-only route.
<IfDefine !DNR_MAINTENANCE_GUARD>
ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders On
# Backend containers change addresses during replacement. Resolve each new connection.
# https://httpd.apache.org/docs/2.4/mod/mod_proxy.html#proxypass

# Keep the read-only notice available while the application/database are stopped.
ProxyPass "/deployment_status.php" "!"
ProxyPass "/maintenance.php" "!"
ProxyPass "/assets/js/maintenance-timer.js" "!"
ErrorDocument 500 /maintenance.php
ErrorDocument 502 /maintenance.php
ErrorDocument 503 /maintenance.php
ProxyErrorOverride On 502 503

# Backup encryption and streaming is the only request allowed to occupy a
# backend connection for fifteen minutes plus completion overhead. Keep the general application
# timeout bounded so unrelated slow clients cannot amplify worker usage.
ProxyPass "/database_maintenance.php" "http://web:80/database_maintenance.php" connectiontimeout=5 timeout=930 retry=0 disablereuse=On
ProxyPassReverse "/database_maintenance.php" "http://web:80/database_maintenance.php"
# Long file transfers use a separate PHP pool; query strings and auth cookies stay intact.
ProxyPassMatch "^/(surls/[a-f0-9]{16}/(?:speaker-notes\.pdf|ppt-slidedeck)|presentation_asset\.php)$" "http://downloads:80/$1" connectiontimeout=3 timeout=120 retry=0 disablereuse=On
ProxyPassReverse "/" "http://downloads:80/"
ProxyPass "/" "http://web:80/" connectiontimeout=5 timeout=60 retry=0 disablereuse=On
ProxyPassReverse "/" "http://web:80/"
</IfDefine>

# The release transaction starts a separate instance of this qualified image.
# It stays alive while every Account ingress is replaced. Never proxy business
# requests or require an application/database to render the maintenance page.
<IfDefine DNR_MAINTENANCE_GUARD>
    <IfModule mpm_prefork_module>
        StartServers 2
        MinSpareServers 1
        MaxSpareServers 2
        ServerLimit 8
        MaxRequestWorkers 8
        MaxConnectionsPerChild 1000
    </IfModule>
    <Directory "/var/www/html">
        RewriteEngine On
        RewriteRule "^(?:a/[a-z][a-z0-9-]{2,63}/)?assets/js/maintenance-timer[.]js$" "/assets/js/maintenance-timer.js" [END]
        RewriteCond %{REQUEST_URI} !^/maintenance_guard[.]php$
        RewriteRule "^" "/maintenance_guard.php" [END]
    </Directory>
</IfDefine>
