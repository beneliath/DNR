# This container is a fixed reverse proxy, never a forward proxy. Keeping the
# public port off the application container preserves its internal-only route.
ProxyRequests Off
ProxyPreserveHost On
ProxyAddHeaders On
# Backend containers change addresses during replacement. Resolve each new connection.
# https://httpd.apache.org/docs/2.4/mod/mod_proxy.html#proxypass

# Keep the read-only notice available while the application/database are stopped.
ProxyPass "/deployment_status.php" "!"

# Backup encryption and streaming is the only request allowed to occupy a
# backend connection for up to five minutes. Keep the general application
# timeout bounded so unrelated slow clients cannot amplify worker usage.
ProxyPass "/database_maintenance.php" "http://web:80/database_maintenance.php" connectiontimeout=5 timeout=300 retry=0 disablereuse=On
ProxyPassReverse "/database_maintenance.php" "http://web:80/database_maintenance.php"
# Long file transfers use a separate PHP pool; query strings and auth cookies stay intact.
ProxyPassMatch "^/(surls/[a-f0-9]{16}/(?:speaker-notes\.pdf|ppt-slidedeck)|presentation_asset\.php)$" "http://downloads:80/$1" connectiontimeout=3 timeout=120 retry=0 disablereuse=On
ProxyPassReverse "/" "http://downloads:80/"
ProxyPass "/" "http://web:80/" connectiontimeout=5 timeout=60 retry=0 disablereuse=On
ProxyPassReverse "/" "http://web:80/"
