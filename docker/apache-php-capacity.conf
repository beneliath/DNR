# Three PHP processes fit the 4 GiB envelope including a 1.25 GiB backup tmpfs.
# The private app sits behind ingress. An idle persistent proxy connection would
# occupy one prefork worker and queue unrelated requests until it times out.
# Release the app worker after each response; ingress owns client keep-alive.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 3
    MaxRequestWorkers 3
    MaxConnectionsPerChild 500
</IfModule>
