# Twenty PHP processes have a 14 GiB container envelope: up to 10 GiB of
# PHP allocations, 1.25 GiB of upload/backup tmpfs, and native/runtime headroom.
# The private app sits behind ingress. An idle persistent proxy connection would
# occupy one prefork worker and queue unrelated requests until it times out.
# Release the app worker after each response; ingress owns client keep-alive.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers 5
    MinSpareServers 5
    MaxSpareServers 10
    ServerLimit 20
    MaxRequestWorkers 20
    MaxConnectionsPerChild 500
</IfModule>
