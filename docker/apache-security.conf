ServerTokens Prod
ServerSignature Off
ServerName localhost

<FilesMatch "(?i)\.(?:sql|env|ini|log|bak|dist)$">
    Require all denied
</FilesMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
# Tile providers require an identifying Referer. Send only the site origin on
# cross-origin requests so map tiles work without disclosing page paths or
# query strings.
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on' || %{HTTP:X-Forwarded-Proto} == 'https'"

# Do not write query strings to the access log. Calendar subscription tokens
# are credentials and may appear in the query component of /calendar.php.
LogFormat "%a %l %u %t \"%m %U %H\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" dnr_redacted
CustomLog /proc/self/fd/1 dnr_redacted

# Static URLs carry an application version, so browsers can retain them until
# the next deployment without revalidation.
<FilesMatch "(?i)\.(?:css|js|woff2|png|jpe?g|webp|svg)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>

AddOutputFilterByType DEFLATE text/css text/javascript application/javascript application/json image/svg+xml
