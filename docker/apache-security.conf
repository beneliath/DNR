ServerTokens Prod
ServerSignature Off
ServerName localhost

# Preserve bearer credentials for authenticated application endpoints. Apache
# otherwise consumes Authorization before mod_php populates $_SERVER.
SetEnvIfNoCase Authorization "^(.*)$" HTTP_AUTHORIZATION=$1

<FilesMatch "(?i)\.(?:sql|env|ini|log|bak|dist)$">
    Require all denied
</FilesMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
# Published collection pages supply a stricter per-resource CSP with explicit
# HTTPS embedding origins. Every other route retains the unconditional deny.
Header always set X-Frame-Options "DENY" "expr=%{REQUEST_URI} !~ m#^/(?:a/[a-z][a-z0-9-]{2,63}/)?audience_collect_public[.]php$#"
# Tile providers require an identifying Referer. Send only the site origin on
# cross-origin requests so map tiles work without disclosing page paths or
# query strings.
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(self), microphone=(), geolocation=()"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on' || %{HTTP:X-Forwarded-Proto} == 'https'"

# Do not write query strings to the access log. Calendar subscription tokens
# are credentials and may appear in the query component of /calendar.php.
# Omit Referer too: it may contain credentials or private search terms.
# Keep the application-generated correlation ID and wall-clock service time in
# the edge log without reintroducing credential-bearing query strings.
LogFormat "%a %l %u %t \"%m %U %H\" %>s %b duration_us=%D request_id=\"%{X-Request-ID}o\" \"%{User-Agent}i\"" dnr_redacted
CustomLog /proc/self/fd/1 dnr_redacted

# Static URLs carry an application version, so browsers can retain them until
# the next deployment without revalidation.
<FilesMatch "(?i)\.(?:css|js|woff2|png|jpe?g|webp|svg)$">
    Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>

AddOutputFilterByType DEFLATE text/css text/javascript application/javascript application/json image/svg+xml

# Most routes accept small forms or imports up to 20 MiB. Keep the larger
# multipart allowance for routes that support multi-file presentation or photo uploads.
LimitRequestBody 33554432
<LocationMatch "^/(?:a/[a-z][a-z0-9-]{2,63}/)?(?:index\.php|edit_engagement\.php|add_organization\.php)(?:/|$)">
    LimitRequestBody 629145600
</LocationMatch>

# Match trailing path information too so the same PHP handler always has the same limit.
<LocationMatch "^/(?:a/[a-z][a-z0-9-]{2,63}/)?(?:login|logout|recover_password|register|accept_invitation|verify_email|verify_2fa|setup_2fa|audience_collect_public|audience_inbox_contact|audience_inbox_optout|audience_subscription)\.php(?:/|$)">
    LimitRequestBody 1048576
</LocationMatch>

# Callers of these endpoints supply raw request bodies. Disable PHP's automatic
# form parsing so a multipart request cannot allocate upload storage before authentication.
<LocationMatch "^/(?:a/[a-z][a-z0-9-]{2,63}/)?(?:api/v1/mattermost|platform_api|account_service|audience_delivery_event|audience_ses_events|audience_ai_api|ai_coach)\.php(?:/|$)">
    php_admin_flag enable_post_data_reading Off
</LocationMatch>
<LocationMatch "^/(?:a/[a-z][a-z0-9-]{2,63}/)?(?:api/v1/mattermost|platform_api|audience_ai_api|ai_coach)\.php(?:/|$)">
    LimitRequestBody 32768
</LocationMatch>
<LocationMatch "^/(?:a/[a-z][a-z0-9-]{2,63}/)?audience_delivery_event\.php(?:/|$)">
    LimitRequestBody 64000
</LocationMatch>
<LocationMatch "^/(?:a/[a-z][a-z0-9-]{2,63}/)?audience_ses_events\.php(?:/|$)">
    LimitRequestBody 262144
</LocationMatch>
<LocationMatch "^/(?:a/[a-z][a-z0-9-]{2,63}/)?account_service\.php(?:/|$)">
    LimitRequestBody 101711872
</LocationMatch>

# Allow multipart framing in addition to a 10 MiB presentation chunk.
<LocationMatch "^/(?:a/[a-z][a-z0-9-]{2,63}/)?presentation_chunk\.php(?:/|$)">
    LimitRequestBody 11534336
</LocationMatch>

# Receipt uploads are limited to 15 MiB of files; allow multipart overhead but
# reject oversized bodies before PHP buffers them under its larger PPT limit.
<LocationMatch "^/(?:a/[a-z][a-z0-9-]{2,63}/)?reimbursement_expense\.php(?:/|$)">
    LimitRequestBody 20971520
</LocationMatch>
