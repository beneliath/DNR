<VirtualHost *:80>
    DocumentRoot /opt/dnr/backup-public
    <Directory /opt/dnr/backup-public>
        Options -Indexes
        AllowOverride None
        Require all granted
        LimitRequestBody 16384
        php_admin_value post_max_size 16K
        php_admin_value max_execution_time 300
    </Directory>
    <LocationMatch "^/(?!export\.php$)">
        Require all denied
    </LocationMatch>
</VirtualHost>
