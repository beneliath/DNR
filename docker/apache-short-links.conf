# Application-only routing; ingress forwards /surls/ unchanged to the app.
<Directory /var/www/html>
    RewriteEngine On
    RewriteRule ^surls/([a-f0-9]{16})/speaker-notes\.pdf$ short_link.php?code=$1&download=1 [END,QSD]
    RewriteRule ^surls/([a-f0-9]{16})$ short_link.php?code=$1 [END,QSD]
</Directory>
