<VirtualHost *:80>
    DocumentRoot /var/www/html
    # Keep the download pool restricted to authorized file delivery and public QR files.
    <LocationMatch "^/(?!presentation_asset\.php$|short_link\.php$|surls/[a-f0-9]{16}/(?:speaker-notes\.pdf|ppt-slidedeck)$)">
        Require all denied
    </LocationMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
