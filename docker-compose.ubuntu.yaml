services:
  web:
    environment:
      # The inner ingress adds its fixed backend address automatically. The
      # only other trusted hop is Traefik on the deployment's private edge network.
      DNR_TRUSTED_PROXY_IPS: ${DNR_EDGE_TRAEFIK_IP:-172.29.255.2},${DNR_INGRESS_PROXY_IP:-172.30.255.254}
      # Cloudflared must be assigned this exact address in the host Traefik
      # stack. Trusting the whole shared proxy subnet would let an unrelated
      # container present forged Cloudflare headers.
      DNR_TRUSTED_CLOUDFLARE_PROXY_IPS: ${DNR_CLOUDFLARED_PROXY_IP:-172.18.0.254}

  ingress:
    # Traefik reaches this container directly. Nothing is published on the
    # Ubuntu host, so bypassing Traefik is not possible from the LAN.
    ports: !reset []
    networks:
      ingress: {}
      backend:
        ipv4_address: ${DNR_INGRESS_PROXY_IP:-172.30.255.254}
      edge:
        ipv4_address: ${DNR_EDGE_INGRESS_IP:-172.29.255.3}
    labels:
      - traefik.enable=${DNR_TRAEFIK_ENABLE:-false}
      - traefik.docker.network=${DNR_EDGE_NETWORK:-dnr_edge}
      - traefik.http.routers.${DNR_TRAEFIK_ROUTER:-dnr}.rule=Host(`${DNR_PUBLIC_HOSTNAME:-dnr.example.org}`)
      - traefik.http.routers.${DNR_TRAEFIK_ROUTER:-dnr}.entrypoints=${DNR_TRAEFIK_ENTRYPOINT:-https}
      - traefik.http.routers.${DNR_TRAEFIK_ROUTER:-dnr}.tls=true
      - traefik.http.routers.${DNR_TRAEFIK_ROUTER:-dnr}.tls.certresolver=${DNR_TRAEFIK_CERT_RESOLVER:-cloudflare}
      - traefik.http.services.${DNR_TRAEFIK_SERVICE:-dnr}.loadbalancer.server.port=80

networks:
  edge:
    name: ${DNR_EDGE_NETWORK:-dnr_edge}
    external: true
