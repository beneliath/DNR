name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, gd, mbstring, mysqli, sodium
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: npm ci
      - run: composer validate --strict --no-check-publish
      - run: composer audit --no-interaction
      - run: npm audit --audit-level=high
      - run: composer check
      - run: npm test
      - run: git diff --exit-code -- src/assets

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable secrets
        run: |
          mkdir -p secrets backups
          openssl rand -hex 32 > secrets/mysql_root_password
          openssl rand -hex 32 > secrets/mysql_app_password
          openssl rand -hex 32 > secrets/mysql_maintenance_password
          openssl rand -base64 32 > secrets/dnr_2fa_encryption_key
          printf '%s' 'integration backup password' > secrets/backup_password
          cp .env.example .env
      - name: Start and migrate disposable database
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d db --wait
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml exec -T db sh /opt/dnr/bin/migrate
      - name: Start application
        run: |
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml build web ingress maintenance
          docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d web ingress --wait
      - name: Exercise HTTP boundaries
        run: |
          sh tests/http_smoke_test.sh
          sh tests/http_authenticated_test.sh
      - name: Run database integration suites
        run: sh scripts/run_integration_tests.sh disposable
      - name: Show service logs
        if: failure()
        run: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml logs --no-color
      - name: Remove disposable environment
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.dev.yaml down -v
